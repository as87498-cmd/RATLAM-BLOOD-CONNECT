<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; background: #fff; margin: 0; padding: 10px; }
    .card { border: 4px solid #e63946; padding: 20px; border-radius: 20px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .header-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .header-box h2 { color: #e63946; font-size: 24px; margin: 0; font-weight: 900; text-align: center; }
    .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
    .tab-btn { flex: 1; padding: 15px; font-size: 18px; font-weight: bold; border: 3px solid #e63946; border-radius: 10px; cursor: pointer; background: #fff; color: #e63946; }
    .active { background: #e63946 !important; color: #fff !important; }
    input, select { width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #333; border-radius: 8px; font-size: 18px; font-weight: bold; box-sizing: border-box; }
    button.main-btn { width: 100%; padding: 20px; border-radius: 10px; border: none; font-weight: bold; font-size: 22px; cursor: pointer; color: white; text-transform: uppercase; margin-top: 10px; }
    .btn-red { background: #e63946; }
    .btn-green { background: #28a745; }
    #successBox { display:none; text-align:center; padding: 40px 10px; }
    .heart { font-size: 100px; animation: beat 1s infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    .res { margin-top: 15px; padding: 15px; background: #fdf2f2; border-radius: 10px; border-left: 6px solid #e63946; font-size: 20px; font-weight: bold; }
    .wa { background: #25D366; color: white; text-decoration: none; display: block; text-align: center; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 18px; }
    #loader { display:none; text-align:center; font-weight:bold; color:red; font-size: 22px; margin: 15px; }
  </style>
</head>
<body>
  <div id="main">
    <div class="tabs">
      <button id="t1" class="tab-btn active" onclick="show('req')">FIND BLOOD</button>
      <button id="t2" class="tab-btn" onclick="show('reg')">BE A DONOR</button>
    </div>

    <!-- Need Blood Section -->
    <div id="reqBox" class="card">
      <div class="header-box"><span>🩸</span><h2>NEED BLOOD</h2><span>🩸</span></div>
      <input type="text" id="pName" placeholder="PATIENT NAME">
      <select id="reqBg">
        <option value="">SELECT BLOOD GROUP</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
      </select>
      
      <select id="hosp">
        <option value="">SELECT NEAREST LOCATION</option>
        <option value="MANAV SEVA SAMITI">NEAR MANAV SEVA SAMITI</option>
        <option value="CIVIL HOSPITAL">NEAR CIVIL HOSPITAL</option>
        <option value="MEDICAL COLLAGE">NEAR MEDICAL COLLAGE</option>
        <option value="OTHER">ANY OTHER AREA IN RATLAM</option>
      </select>
      
      <button class="main-btn btn-red" onclick="doSearch()">SEARCH NOW</button>
      <div id="loader">SEARCHING...</div>
      <div id="results"></div>
    </div>

    <!-- Donor Registration Section -->
    <div id="regBox" class="card" style="display:none;">
      <div class="header-box"><span>🩸</span><h2>BE A HERO</h2><span>🩸</span></div>
      <input type="text" id="dName" placeholder="YOUR FULL NAME">
      <input type="number" id="dPhone" placeholder="MOBILE NO.">
      <select id="dBg">
        <option value="">YOUR GROUP</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
      </select>
      <select id="dLast">
        <option value="">LAST DONATED DATE</option>
        <option value="NEVER">NEVER</option>
        <option value="OVER 3 MONTHS">3 MONTHS AGO</option>
        <option value="RECENT">RECENT</option>
      </select>

      <select id="dCity">
        <option value="">SELECT YOUR NEAREST AREA</option>
        <option value="MANAV SEVA SAMITI">NEAR MANAV SEVA SAMITI</option>
        <option value="CIVIL HOSPITAL">NEAR CIVIL HOSPITAL</option>
        <option value="MEDICAL COLLAGE">NEAR MEDICAL COLLAGE</option>
        <option value="OTHER">OTHER AREA</option>
      </select>
      
      <button class="main-btn btn-green" onclick="doRegister()">REGISTER</button>
    </div>
  </div>

  <div id="successBox" class="card">
    <div class="heart">❤️</div>
    <h1 style="color:#e63946">DHANYAWAD!</h1>
    <p style="font-size:20px; font-weight:bold;">Aapki details save ho gayi hain.</p>
    <button class="main-btn btn-red" onclick="location.reload()">BACK</button>
  </div>

  <script>
    function show(t) {
      document.getElementById('reqBox').style.display = t=='req'?'block':'none';
      document.getElementById('regBox').style.display = t=='reg'?'block':'none';
      document.getElementById('t1').className = t=='req'?'tab-btn active':'tab-btn';
      document.getElementById('t2').className = t=='reg'?'tab-btn active':'tab-btn';
    }

    function doRegister() {
      const d = { 
        name: document.getElementById('dName').value, 
        phone: document.getElementById('dPhone').value, 
        bloodGroup: document.getElementById('dBg').value, 
        lastDonation: document.getElementById('dLast').value, 
        city: document.getElementById('dCity').value 
      };
      if(!d.name || !d.phone || !d.bloodGroup || !d.city) return alert("Puri details bharein!");
      google.script.run.withSuccessHandler(() => { 
        document.getElementById('main').style.display='none'; 
        document.getElementById('successBox').style.display='block'; 
      }).addDonor(d);
    }

    function doSearch() {
      const bg = document.getElementById('reqBg').value;
      if(!bg) return alert("Pehle Blood Group chunein!");
      
      document.getElementById('loader').style.display='block';
      const data = { 
        pName: document.getElementById('pName').value, 
        bloodGroup: bg, 
        hospital: document.getElementById('hosp').value 
      };
      
      google.script.run.withSuccessHandler(list => {
        document.getElementById('loader').style.display='none';
        let res = document.getElementById('results'); 
        res.innerHTML = "";
        if(list.length==0) {
          res.innerHTML = "<b>MAAF KAREIN, KOI DONOR NAHI MILA.</b>";
        } else {
          res.innerHTML = "<h3>SAVIORS FOUND:</h3>";
          list.forEach(d => { 
            res.innerHTML += `<div class="res"><b>${d.n}</b><br>AREA: ${d.a}<a href="${d.l}" target="_blank" class="wa">WHATSAPP ALERT</a></div>`; 
          });
        }
      }).processRequest(data);
    }
  </script>
</body>
</html>
